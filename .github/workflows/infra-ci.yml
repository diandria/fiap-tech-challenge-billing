name: Infra CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'scripts/check-no-public-ingress.py'
      - '.github/workflows/infra-*.yml'

permissions:
  contents: read

env:
  TF_VERSION: "1.15.6"

defaults:
  run:
    working-directory: terraform

jobs:
  # Needs no AWS credential, so it still holds when the Learner Lab's
  # temporary key expires.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      # trivy reports nothing for an ingress open to 0.0.0.0/0 on port 5432;
      # this check closes that gap.
      - name: No ingress open to the internet
        run: python3 ../scripts/check-no-public-ingress.py

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --format compact

      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
