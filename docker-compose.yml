# Billing Service on its own: its database, a local SQS and the payment
# service it charges through, built from ../fiap-tech-challenge-payment. Host
# ports differ from the OS Service compose, so both can run side by side.
services:
  postgres:
    image: postgres:16-alpine
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5433:5432"
    volumes:
      - billing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Pinned to the last community release: newer images refuse to start
  # without a license token.
  localstack:
    image: localstack/localstack:4.9.2
    container_name: billing-localstack
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://billing:billing@postgres:5432/billing?schema=public"
      JWT_SECRET: "dev-secret-change-in-prod"
      OTEL_SERVICE_NAME: "billing-service"
      # Local runs never charge anyone: the payment service stands in for
      # Mercado Pago, with the credentials and webhook secret set below.
      PAYMENT_PROVIDER: "mercado-pago"
      MERCADO_PAGO_API_URL: "http://payment:3000"
      MERCADO_PAGO_CLIENT_ID: "billing-local"
      MERCADO_PAGO_CLIENT_SECRET: "local-client-secret"
      MERCADO_PAGO_WEBHOOK_SECRET: "local-webhook-secret"
      MERCADO_PAGO_NOTIFICATION_URL: "http://app:3000/payments/notifications"
    depends_on:
      postgres:
        condition: service_healthy
      payment:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  payment:
    build: ../fiap-tech-challenge-payment
    ports:
      - "3003:3000"
    environment:
      PORT: "3000"
      CLIENT_ID: "billing-local"
      CLIENT_SECRET: "local-client-secret"
      WEBHOOK_SECRET: "local-webhook-secret"
      CHECKOUT_BASE_URL: "http://localhost:3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  billing-postgres-data:
